name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast checks: types and the unit tests, which need no services.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit

  # The Go CLI: vet and its tests (they use the system's ssh-keygen and ssh-agent).
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: go vet ./...
      - run: go test ./...
